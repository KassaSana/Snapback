name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

# A scheduled run must never pile up on top of a manual one, and vice versa.
concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-unsigned-package:
    name: Windows unsigned package
    runs-on: windows-latest
    # Hard ceiling: packaging + GUI smoke must never hang the runner indefinitely.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Same source of truth as ci.yml, so this smoke exercises the Node the frontend is
          # actually tested and released on.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build unsigned Windows package
        shell: pwsh
        run: .\scripts\package_windows.ps1

      - name: Run GUI smoke
        shell: pwsh
        # Tight cap: this step launches the GUI, so it's the most likely to hang if the
        # smoke script's own watchdog ever fails to close the window.
        timeout-minutes: 8
        run: .\scripts\gui_smoke_windows.ps1 -BuildDir build-windows-package -NoBuild

      # The ZIP name carries CMake's PROJECT_VERSION. Spelled out literally, this step would
      # start failing the weekly smoke the first Monday after any version bump — and the
      # failure would look like a packaging bug rather than a stale string. Resolve what was
      # actually built instead, and insist on exactly one match so a leftover ZIP from an
      # earlier version cannot be validated in place of this run's.
      - name: Validate packaged ZIP
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem "build-windows-package\Snapback-*-win64.zip")
          if ($zips.Count -ne 1) {
            throw "Expected exactly one packaged ZIP, found $($zips.Count): $($zips.Name -join ', ')"
          }
          .\scripts\validate_windows_package.ps1 -PackageZip $zips[0].FullName

      - name: Upload unsigned package
        uses: actions/upload-artifact@v7
        with:
          name: snapback-windows-unsigned
          path: |
            build-windows-package/*.zip
            build-windows-package/*.exe
          if-no-files-found: error
