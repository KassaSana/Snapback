name: CI

# Guards the native application. Coverage:
#   - portable core (core + capture + app-lib + tests) on Windows / macOS / Linux
#   - the same core on Windows with MinGW-w64 GCC, the toolchain 11.8's bug lived in
#   - AddressSanitizer + UBSan on the manual-memory paths (ring buffer, locks, RAII)
#   - the ONNX inference backend on Linux (vendored runtime + fixture model)
#   - the benchmark harness (short smoke run)
#   - frontend dependency vulnerability audit
#   - the React frontend (typecheck + tests + build)
#   - the Windows desktop app (no-launch integration smoke)
#   - the desktop app link on Linux (build-only, never launched)
#   - the desktop app on macOS, built *and launched*, by the GUI smoke job
#   - docs invariants
#
# Anti-hang guarantees: every job has `timeout-minutes`, the riskiest steps have their
# own step timeout, ctest uses `--timeout`/`--no-tests=error`, the GUI app is never
# launched here, and superseded PR runs are cancelled so nothing piles up.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded *pull request* runs are cancelled; pushes to master are not. release.yml's
  # 9.11 gate will only publish a tag whose exact commit already has a successful ci.yml run,
  # and a cancelled run is not a successful one — so cancelling here on master would quietly
  # make that commit unreleasable. Nothing piles up regardless: every job has a timeout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  # ---------------------------------------------------------------------------
  # Dependency vulnerability audit. This checks the committed frontend lockfile
  # against npm's advisory database and fails on high/critical vulnerabilities.
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security audit / frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend npm dependencies
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

  # ---------------------------------------------------------------------------
  # Portable core on all three OSes: pure logic, no webview, no ONNX. Must stay
  # green everywhere (the capture/app sources are #if-guarded per platform).
  # ---------------------------------------------------------------------------
  cpp-headless:
    name: C++ headless tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSNAPBACK_BUILD_APP=OFF -DSNAPBACK_ONNX=OFF

      - name: Build C++ tests
        run: cmake --build build --target snapback_tests --config Release

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120 --no-tests=error

  # ---------------------------------------------------------------------------
  # The portable core again, on Windows with MinGW-w64 GCC. Roadmap 6.6.
  #
  # cpp-headless above compiles Windows with MSVC and the other two OSes with
  # clang++, which leaves exactly one combination nobody builds: **libstdc++'s
  # MinGW filesystem implementation**. That is where 11.8's production bug lived
  # — `copy_options::overwrite_existing` is silently ignored there, which broke
  # model rollback outright and left `save_app_settings` writing a stale backup
  # while reporting success. It reached `master`, and it was found only because a
  # portable GCC happened to be the only compiler on the dev machine. Nothing
  # about that was systematic; this is.
  #
  # Headless only. The desktop app's Win32 GUI link under MinGW is a separate
  # question and not the one this job exists to answer.
  #
  # No `needs:` — same Roadmap 6.3 reasoning as the desktop jobs: a toolchain
  # guard that stops running when the rest of CI is red does not guard the case
  # it exists for.
  #
  # Expect a *pass* here to mean less than it does elsewhere in one specific way:
  # 11.9 records that the `CaptureThread` contradiction case does not detect its
  # own bug on this toolchain. That is a documented property of the test, not a
  # regression in this job.
  # ---------------------------------------------------------------------------
  windows-gcc:
    name: C++ headless tests / windows-gcc
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # Overrides the workflow-level bash: the toolchain, its cmake, and its
        # mingw32-make all live inside the UCRT64 environment, and reaching them
        # from the runner's own bash would build against a different libstdc++
        # than the one under test.
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # UCRT rather than MSVCRT: it is what current MinGW-w64 defaults to and what
      # the dev machine that found 11.8 was running, so this reproduces that
      # environment rather than an older one. `git` is installed explicitly because
      # CMake's FetchContent needs it and the MSYS2 shell does not inherit the
      # runner's PATH.
      - name: Setup MSYS2 (MinGW-w64 UCRT)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Report the toolchain under test
        run: g++ --version

      - name: Configure core (MinGW Makefiles)
        run: >
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          -DSNAPBACK_BUILD_APP=OFF -DSNAPBACK_ONNX=OFF

      - name: Build C++ tests
        run: cmake --build build --target snapback_tests

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure --timeout 120 --no-tests=error

  # ---------------------------------------------------------------------------
  # AddressSanitizer + UBSan (Linux/clang). Highest-value guard for the SPSC ring
  # buffer, lock discipline, and RAII — the highest-value manual-memory paths.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (asan+ubsan)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CC: clang
      CXX: clang++
      # Leak detection off: third-party statics (sqlite) and singletons report benign
      # "still reachable"; we want real memory errors + UB, not those.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (sanitized)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build tests
        run: cmake --build build --target snapback_tests

      - name: Run CTest (sanitized)
        run: ctest --test-dir build --output-on-failure --timeout 300 --no-tests=error

  # ---------------------------------------------------------------------------
  # ThreadSanitizer (Linux/clang). Runs the concurrency tests — the SPSC ring stress
  # (test_ring_buffer.cpp) and the AppState reader/writer race test (test_app_state.cpp)
  # — under TSan to catch data races in the hand-rolled acquire/release ring and lock-order
  # bugs in the two-mutex state split. RelWithDebInfo keeps TSan fast enough for the
  # 500k-iteration ring test; the 600s ctest timeout is the safety net.
  # ---------------------------------------------------------------------------
  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (tsan)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build tests
        run: cmake --build build --target snapback_tests

      - name: Run CTest (tsan)
        run: ctest --test-dir build --output-on-failure --timeout 600 --no-tests=error

  # ---------------------------------------------------------------------------
  # ONNX backend: vendor the runtime, build with SNAPBACK_ONNX=ON, run tests. The
  # ONNX fixture test loads fixtures/model.onnx and asserts backend() == "onnx".
  # ---------------------------------------------------------------------------
  onnx-linux:
    name: ONNX backend / linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Roadmap 8.9. Same manifest as the Windows job -- see the comment there.
      - name: Vendor ONNX Runtime
        timeout-minutes: 5
        run: |
          # python3 rather than jq: the docs-smoke job already depends on python3, so this
          # adds no new tool to the runner image.
          pins=third_party/onnxruntime-pins.json
          read_pin() { python3 -c "import json,sys; print(json.load(open('${pins}'))$1)"; }
          version=$(read_pin "['version']")
          archive=$(read_pin "['archives']['linux-x64']['file']")
          expected=$(read_pin "['archives']['linux-x64']['sha256']")
          release_url=$(read_pin "['release_url']")
          curl --fail --location --retry 3 "${release_url}/${archive}" --output "${archive}"
          # Verify before extracting. This archive is executable code that CMake links into
          # the test binary, and extraction is what writes attacker-controlled paths to disk.
          echo "${expected}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" --directory third_party
          mv "third_party/onnxruntime-linux-x64-${version}" third_party/onnxruntime
          test -f third_party/onnxruntime/lib/libonnxruntime.so

      - name: Configure (ONNX on)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSNAPBACK_ONNX=ON

      - name: Build tests
        run: cmake --build build --config Release --target snapback_tests

      - name: Run CTest (incl. ONNX fixture)
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120 --no-tests=error

  # ---------------------------------------------------------------------------
  # Benchmark smoke: the harness still builds and completes on a short trace.
  # Bounded by SNAPBACK_BENCH_MINUTES and a step timeout so it can't run away.
  # ---------------------------------------------------------------------------
  benchmark-smoke:
    name: Benchmark smoke / linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (benchmarks on)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSNAPBACK_BUILD_BENCHMARKS=ON

      - name: Build benchmark
        run: cmake --build build --config Release --target snapback_benchmarks

      - name: Run short benchmark
        timeout-minutes: 3
        env:
          SNAPBACK_BENCH_MINUTES: "5"
        run: ./build/snapback_benchmarks

  # ---------------------------------------------------------------------------
  # Reused React frontend: typecheck, unit/component tests, production build.
  # ---------------------------------------------------------------------------
  frontend-mock:
    name: Frontend mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        timeout-minutes: 8
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests and component coverage gate
        working-directory: frontend
        run: npm run test:ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      # Roadmap 8.10 is a promise about the *shipped* page, and this is the only job that
      # produces one. frontend/dist is gitignored, so the same guard in docs-smoke sees only
      # the source index.html and never the inlined bundle the user actually loads. Running it
      # here, after the build, is what checks the artifact the promise is about.
      - name: The built bundle must not fetch anything
        run: python3 scripts/check_no_remote_subresources.py --verbose

  # ---------------------------------------------------------------------------
  # Windows desktop app: build + no-launch integration smoke (never starts the
  # GUI, which would hang).
  #
  # Deliberately has NO `needs:` (Roadmap 6.3): with `needs: [cpp-headless,
  # frontend-mock]` this job was *skipped* whenever those failed — so the one
  # guard over Windows-only desktop code stopped running exactly when CI was
  # red, which is when it matters most. A guard that only executes when
  # everything else is green does not guard the case it exists for.
  # ---------------------------------------------------------------------------
  windows-desktop-integration:
    name: Windows desktop integration smoke
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Windows demo no-launch smoke
        shell: pwsh
        timeout-minutes: 30
        run: .\scripts\windows_demo.ps1 -UseVite -NoLaunch

      - name: Upload demo logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-demo-logs
          path: |
            .demo/*.log
            build-windows-demo/**/*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Desktop app link on macOS + Linux. Build only — this job never launches the
  # GUI, so it exists purely to prove `snapback` still links. On macOS the launch
  # itself is now covered by macos-gui-smoke below; on Linux, building remains the
  # only guarantee there is.
  #
  # Why it exists: every other job configures with SNAPBACK_BUILD_APP=OFF, and the
  # only job that built the real binary was Windows-only. That left main.cpp
  # unlinked on two of three OSes indefinitely — which is how Overlay::instance()
  # and Tray::instance() stayed undefined off Windows without anyone noticing.
  # An opt-in build target is an opt-in guarantee; this is the guarantee.
  # ---------------------------------------------------------------------------
  # Deliberately no `needs:` — same Roadmap 6.3 reasoning as the Windows job
  # above: this link check depends on the code compiling, not on the headless
  # suite passing, and gating it on test jobs made it skip while CI was red.
  desktop-app-build:
    name: Desktop app build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # macOS is deliberately absent. `macos-gui-smoke` below runs the identical configure
      # and build (scripts/gui_smoke_macos.sh) and then launches the result — and a binary
      # that launched must have linked, so a separate macOS link check proves nothing the
      # smoke job has not already proved. It cost ~12 of the run's 84 billed minutes at the
      # x10 macOS multiplier and turned one macOS build break into two red X's.
      #
      # Kept as a one-entry matrix rather than inlined so the check keeps the name
      # "Desktop app build / ubuntu-latest" that branch protection may already require.
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # webview picks webkit2gtk-4.1 first and falls back to 4.0; 4.1 is what
      # ubuntu-latest ships.
      # This step normally takes seconds, and it had no timeout of its own while the build
      # step below did — so when apt hung on 2026-08-19 it burned all 30 minutes of the job
      # budget and reported nothing. That contradicted this file's own anti-hang promise that
      # the riskiest steps carry a step timeout; fetching packages over the network is the
      # riskiest step in this job. Five minutes is ~10x the normal duration: long enough for a
      # slow mirror, short enough that a hang fails fast and reads as a hang.
      #
      # DEBIAN_FRONTEND=noninteractive so apt can never block on a prompt no one can answer.
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        # The runner image ships a mirrorlist (/etc/apt/apt-mirrors.txt) whose first entry is
        # azure.archive.ubuntu.com. When that host is unreachable — as it was on 2026-08-19 —
        # apt spends its whole retry budget per index file before falling back, so `update`
        # never finishes and the step dies on its timeout. The packages are not the problem:
        # the same log shows archive.ubuntu.com answering `Hit`/`Get` immediately while every
        # azure line reads `Ign`.
        #
        # So point apt at the host that answered, and bound the per-connection timeouts. A
        # plain retry loop is not enough on its own and was actively counterproductive here:
        # it repeated a five-minute hang three times rather than failing once.
        run: |
          set -eu
          # Not fatal if a future image renames this file or drops the mirrorlist: apt still
          # works, it just keeps whatever mirror the image chose. Say so rather than dying on
          # something incidental to installing two packages.
          sources=/etc/apt/sources.list.d/ubuntu.sources
          if [ -f "$sources" ] && grep -q 'mirror+file:/etc/apt/apt-mirrors.txt' "$sources"; then
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' "$sources"
            echo "apt: pinned to archive.ubuntu.com in $sources"
          else
            echo "apt: no mirrorlist entry found in $sources; leaving apt sources as the image set them" >&2
          fi
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for attempt in 1 2 3; do
            if sudo apt-get $apt_opts update && \
               sudo apt-get $apt_opts install -y libgtk-3-dev libwebkit2gtk-4.1-dev; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed; retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          echo "apt failed three times against a reachable mirror; this is a real failure" >&2
          exit 1

      - name: Configure (app on)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSNAPBACK_BUILD_APP=ON -DSNAPBACK_ONNX=OFF

      - name: Build desktop app (link check, no launch)
        timeout-minutes: 20
        run: cmake --build build --target snapback --config Release

  # ---------------------------------------------------------------------------
  # macOS GUI launch smoke — ADR-0002 release blocker.
  #
  # This is now the *only* job that builds the macOS app, since it already ran
  # the same configure and build that desktop-app-build's macOS entry did. It
  # proves more than linking: the two ways the binary can fail to start are both
  # invisible at link time — a webview that cannot create its window, and a
  # frontend bundle that never got copied next to the executable (an empty
  # window, not an error).
  # scripts/gui_smoke_macos.sh launches the real binary, drives a session
  # start/stop through AppState and SQLite from the UI thread, and requires the
  # run loop to exit on its own.
  #
  # No `needs:` for the same Roadmap 6.3 reason as the two jobs above: this
  # depends on the code compiling, not on the headless suite passing.
  # ---------------------------------------------------------------------------
  macos-gui-smoke:
    name: macOS GUI launch smoke
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The bundle must exist before CMake configures — the copy that puts
      # frontend/dist next to the executable is wired at configure time, which
      # the script's own ordering depends on.
      - name: Launch smoke
        timeout-minutes: 25
        run: ./scripts/gui_smoke_macos.sh

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-gui-smoke-logs
          path: .demo/gui-smoke-data-macos/*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Docs invariants.
  # ---------------------------------------------------------------------------
  docs-smoke:
    name: Docs smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # checkout defaults to a shallow clone of one commit. The attribution guard below
          # walks the whole history, and against a shallow clone it would cheerfully report
          # "checked 1 commits" forever -- passing without looking at anything.
          fetch-depth: 0

      - name: Ensure Windows demo runbook is linked
        run: |
          grep -q "docs/windows_demo.md" README.md
          test -f docs/windows_demo.md

      # Roadmap Tier 12 exists because docs repeatedly named files that were never
      # created or had moved, and nothing caught it. This makes that mechanical.
      - name: Every path a doc names must exist
        run: python3 scripts/check_doc_paths.py

      # Roadmap 8.6. Dependabot watches Actions and npm but not CMake FetchContent, so a
      # dependency pinned to a mutable tag is source we compile and ship with nothing
      # watching it. Cheap to check, and only a guard stops the policy from rotting.
      - name: Every fetched dependency must be pinned to an immutable revision
        run: python3 scripts/check_dependency_pins.py --verbose

      # Roadmap 8.9. The guard above reads CMakeLists.txt and so never saw the ONNX
      # archives the two ONNX jobs download straight from a release URL. A release asset
      # can be re-uploaded under the same name, so the digest is the only real pin.
      - name: Every vendored ONNX archive must be verified before extraction
        run: python3 scripts/check_onnx_pins.py --verbose

      # Roadmap 4.13. The scheduled pin-freshness workflow queries GitHub; this only
      # checks that the parser still sees onnx + the three git FetchContent pins, so a
      # CMake rename cannot silently empty the watcher.
      - name: Pin-freshness parser still sees every watched pin
        run: python3 scripts/check_pin_freshness.py --offline --verbose

      # $ErrorActionPreference = "Stop" does not cover native executables, so an unchecked
      # cmake/npm call in a .ps1 lets a red build exit 0. windows_demo.ps1 did exactly that:
      # the Windows job stayed green across three commits whose main.cpp did not compile, and
      # only the macOS/Linux jobs — which call cmake straight from the workflow — noticed.
      - name: Every native call in a PowerShell script must check its exit code
        run: python3 scripts/check_ps_exit_codes.py --verbose

      # Every commit here is Kassa's own work. Several tools append attribution trailers by
      # default, silently, at commit time. Such a commit is permanent in a way an ordinary
      # mistake is not: rewriting it changes every SHA after it, which would break release
      # tags and 9.11's CI-conclusion gate. Catch it before it lands.
      - name: Every commit must be attributed to Kassa
        run: python3 scripts/check_commit_attribution.py --verbose

      # The gate above runs after the commit exists, which is too late to fix one without
      # rewriting history. scripts/hooks/commit-msg removes the trailers while they are still
      # free to remove. Nothing else exercises it -- a clone that never enables the hook is
      # the normal case -- so a broken hook would sit undetected until the day it was needed.
      # These cases run the real hook against real messages rather than reading it as text.
      - name: The commit-msg hook must strip what CI rejects
        run: sh scripts/test_commit_msg_hook.sh

      # Roadmap 8.10. The Privacy card promises "Nothing leaves this device" and the bundler
      # claims zero subresource requests. Both were false because the page fetched webfonts —
      # and invisibly so, since an offline launch just rendered fallback type and looked fine.
      - name: The shipped page must not fetch anything
        run: python3 scripts/check_no_remote_subresources.py --verbose

      # Roadmap 11.11. Pure-logic modules are excluded from the component-coverage gate
      # because a different runner tests them. That list is one edit away from being a way to
      # silence the gate rather than sharpen it, and the failure would look like an improving
      # coverage number.
      - name: Every coverage exclusion must be tested somewhere else
        run: python3 scripts/check_coverage_exclusions.py --verbose
