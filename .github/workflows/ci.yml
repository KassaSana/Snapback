name: CI

# Guards the native application. Coverage:
#   - portable core (core + capture + app-lib + tests) on Windows / macOS / Linux
#   - AddressSanitizer + UBSan on the manual-memory paths (ring buffer, locks, RAII)
#   - the React frontend (typecheck + tests + build)
#   - the Windows desktop app, built and launched through a real-webview acceptance smoke
#   - the desktop app on macOS, built *and launched*, by the GUI smoke job
#   - repository, documentation, and supply-chain guards on the Ubuntu core run
#
# Anti-hang guarantees: every job has `timeout-minutes`, the riskiest steps have their
# own step timeout, ctest uses `--timeout`/`--no-tests=error`, GUI launch smokes have
# bounded waits, and superseded PR runs are cancelled so nothing piles up.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded *pull request* runs are cancelled; pushes to master are not. release.yml's
  # 9.11 gate will only publish a tag whose exact commit already has a successful ci.yml run,
  # and a cancelled run is not a successful one — so cancelling here on master would quietly
  # make that commit unreleasable. Nothing piles up regardless: every job has a timeout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  # ---------------------------------------------------------------------------
  # Portable core on all three OSes: pure logic, no webview, no ONNX. Must stay
  # green everywhere (the capture/app sources are #if-guarded per platform).
  # ---------------------------------------------------------------------------
  cpp-headless:
    name: C++ headless tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The Ubuntu entry also runs the attribution guard, which must inspect
          # history rather than passing against a one-commit shallow checkout.
          fetch-depth: 0

      - name: Configure core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSNAPBACK_BUILD_APP=OFF -DSNAPBACK_ONNX=OFF

      - name: Build C++ tests
        run: cmake --build build --target snapback_tests --config Release

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120 --no-tests=error

      # Keep these inexpensive repository guards on the existing Ubuntu runner
      # rather than paying for a separate "docs smoke" job on every push.
      - name: Repository guards
        if: matrix.os == 'ubuntu-latest'
        run: |
          grep -q "docs/windows_demo.md" README.md
          test -f docs/windows_demo.md
          python3 scripts/check_release_legal.py --verbose
          python3 scripts/check_doc_paths.py
          python3 scripts/check_doc_symbols.py --verbose
          python3 scripts/check_dependency_pins.py --verbose
          python3 scripts/check_onnx_pins.py --verbose
          python3 scripts/check_pin_freshness.py --offline --verbose
          python3 scripts/check_ps_exit_codes.py --verbose
          python3 scripts/check_commit_attribution.py --verbose
          sh scripts/test_commit_msg_hook.sh
          python3 scripts/check_no_remote_subresources.py --verbose
          python3 scripts/check_coverage_exclusions.py --verbose
          python3 scripts/check_unit_test_wiring.py --verbose
          python3 scripts/check_no_bom.py
          python3 scripts/check_scripts_documented.py
          python3 scripts/check_roadmap_status.py --verbose
          python3 scripts/check_dead_headers.py --verbose

  # ---------------------------------------------------------------------------
  # AddressSanitizer + UBSan (Linux/clang). Highest-value guard for the SPSC ring
  # buffer, lock discipline, and RAII — the highest-value manual-memory paths.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (asan+ubsan)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CC: clang
      CXX: clang++
      # Leak detection off: third-party statics (sqlite) and singletons report benign
      # "still reachable"; we want real memory errors + UB, not those.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (sanitized)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build tests
        run: cmake --build build --target snapback_tests

      - name: Run CTest (sanitized)
        run: ctest --test-dir build --output-on-failure --timeout 300 --no-tests=error

  # ---------------------------------------------------------------------------
  # Reused React frontend: typecheck, unit/component tests, production build.
  # ---------------------------------------------------------------------------
  frontend-mock:
    name: Frontend mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        timeout-minutes: 8
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # Roadmap 4.12. Correctness rules only -- Prettier owns layout, and the existing tree
      # was deliberately not reformatted. The React Hooks rules are the reason this earns a
      # job step: a dependency array that lies produces a stale closure, which is a real bug
      # that renders fine and passes every assertion.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests and component coverage gate
        working-directory: frontend
        run: npm run test:ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Build hosted demo
        working-directory: frontend
        run: npm run build:demo

      # Roadmap 8.10 is a promise about the *shipped* page, and this is the only job that
      # produces one. frontend/dist is gitignored, so the repository guard sees only
      # the source index.html and never the inlined bundle the user actually loads. Running it
      # here, after the build, is what checks the artifact the promise is about.
      - name: The built bundle must not fetch anything
        run: python3 scripts/check_no_remote_subresources.py --verbose

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Windows desktop app: build + bounded real-webview acceptance smoke. The app
  # terminates itself after publishing its verdict, and the script kills it on timeout.
  #
  # Deliberately has NO `needs:` (Roadmap 6.3): with `needs: [cpp-headless,
  # frontend-mock]` this job was *skipped* whenever those failed — so the one
  # guard over Windows-only desktop code stopped running exactly when CI was
  # red, which is when it matters most. A guard that only executes when
  # everything else is green does not guard the case it exists for.
  # ---------------------------------------------------------------------------
  windows-desktop-integration:
    name: Windows desktop integration smoke
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Windows desktop acceptance target
        shell: pwsh
        timeout-minutes: 30
        run: .\scripts\windows_demo.ps1 -UseVite -EnableAcceptanceHarness -NoLaunch

      - name: Run Windows real-webview acceptance smoke
        shell: pwsh
        timeout-minutes: 5
        run: .\scripts\gui_smoke_windows.ps1 -BuildDir build-windows-demo -Config Debug -NoBuild -Acceptance

      - name: Drive the Windows UI through WebView2 CDP
        shell: pwsh
        timeout-minutes: 5
        run: .\scripts\gui_smoke_windows.ps1 -BuildDir build-windows-demo -Config Debug -NoBuild -Driven

      - name: Upload demo logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-demo-logs
          path: |
            .demo/*.log
            build-windows-demo/**/*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Desktop app link on macOS + Linux. Build only — this job never launches the
  # GUI, so it exists purely to prove `snapback` still links. On macOS the launch
  # itself is now covered by macos-gui-smoke below; on Linux, building remains the
  # only guarantee there is.
  #
  # Why it exists: every other job configures with SNAPBACK_BUILD_APP=OFF, and the
  # only job that built the real binary was Windows-only. That left main.cpp
  # unlinked on two of three OSes indefinitely — which is how Overlay::instance()
  # and Tray::instance() stayed undefined off Windows without anyone noticing.
  # An opt-in build target is an opt-in guarantee; this is the guarantee.
  # ---------------------------------------------------------------------------
  # Deliberately no `needs:` — same Roadmap 6.3 reasoning as the Windows job
  # above: this link check depends on the code compiling, not on the headless
  # suite passing, and gating it on test jobs made it skip while CI was red.
  # ---------------------------------------------------------------------------
  # macOS GUI launch smoke — ADR-0002 release blocker.
  #
  # This is now the *only* job that builds the macOS app, since it already ran
  # the same configure and build that desktop-app-build's macOS entry did. It
  # proves more than linking: the two ways the binary can fail to start are both
  # invisible at link time — a webview that cannot create its window, and a
  # frontend bundle that never got copied next to the executable (an empty
  # window, not an error).
  # scripts/gui_smoke_macos.sh launches the real binary and runs page-side checks
  # through the shim, webview binding, AppState, and SQLite before requiring the
  # run loop to exit on its own.
  #
  # No `needs:` for the same Roadmap 6.3 reason as the two jobs above: this
  # depends on the code compiling, not on the headless suite passing.
  # ---------------------------------------------------------------------------
  macos-gui-smoke:
    name: macOS GUI launch smoke
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The bundle must exist before CMake configures — the copy that puts
      # frontend/dist next to the executable is wired at configure time, which
      # the script's own ordering depends on.
      - name: Launch smoke
        timeout-minutes: 25
        run: ./scripts/gui_smoke_macos.sh

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-gui-smoke-logs
          path: .demo/gui-smoke-data-macos/*.log
          if-no-files-found: ignore
